<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Mathieu Le Bellec — Full Stack Developer</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Mathieu Le Bellec — Full Stack Developer (Angular / .NET) based in Rennes, France. CV, experience, portfolio and creative work in French, English and Spanish.">
  <meta name="theme-color" content="#f4f4f6">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Fira+Code:wght@400;500&display=swap">
</head>
<body>
  <script>
    // Apply the saved theme before Angular boots to avoid a flash of the wrong palette.
    (function () {
      try {
        var stored = localStorage.getItem('cv-dark-mode');
        var dark = stored !== null
          ? stored === 'true'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.add(dark ? 'dark-mode' : 'light-mode');
      } catch (e) {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>
  <app-root></app-root>
</body>
</html>
