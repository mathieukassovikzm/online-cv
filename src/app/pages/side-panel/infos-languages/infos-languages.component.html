<ul>
  @for (item of languageStore.getLanguages(); track item) {
    <li>
      <div class="logo">
        @if (item.code === codeFr) {
          <app-svg-fr></app-svg-fr>
        }
        @if (item.code === codeEn) {
          <app-svg-en></app-svg-en>
        }
        @if (item.code === codeEs) {
          <app-svg-es></app-svg-es>
        }
      </div>
      <h6>{{ item.name }} : {{ item.power }}</h6>
    </li>
  }
</ul>
