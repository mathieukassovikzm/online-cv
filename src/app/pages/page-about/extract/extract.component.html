<h2>{{uiText.extractTitle}}</h2>
<div class="card-container">
  <div class="card-infos">
    <span class="quote-in"><app-svg-quote></app-svg-quote></span>
    @for (item of extract(); track $index) {
    <p>
      {{item}}
    </p>
    }
    <span class="quote-out"><app-svg-quote></app-svg-quote></span>
  </div>
</div>
