<div class="card-container">
  <div class="card-infos">
    <div class="title-container">
      <h4 class="title">
        {{item()?.title}}
      </h4>
    </div>
    @if (item()?.descriptions; as description) {
      <div class="description">
        @for (dsc of description; track $index) {
          <p> {{dsc}} </p>
        }
      </div>
    }
  </div>
</div>
